[package]
name = "dancing-lights"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m-rt = "0.7.7"
cyw43 = { version = "0.7.0", features = ["defmt", "firmware-logs"] }
cyw43-pio = { version = "0.10.0", features = ["defmt"] }
defmt = "1.2.0"
defmt-rtt = "1.3.1"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "embassy-time-driver", "defmt", "executor-thread", "executor-interrupt"] }
embassy-net = { version = "0.9.1", features = ["defmt"] }
embassy-rp = { version = "0.10.0", features = ["rt", "defmt", "critical-section-impl", "time-driver", "executor-thread", "executor-interrupt", "rp2040"] }
embassy-time = { version = "0.5.1", features = ["defmt"] }
panic-probe = { version = "1.0.0", features = ["defmt", "print-defmt"] }
